name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m py_compile legacy_automation_auditor.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Install CLI
        run: python -m pip install .

      - name: Check CLI entry point
        run: undertaker --help

      - name: Check CLI version
        run: undertaker --version

      - name: Check JSON stdout
        run: undertaker --format json --no-json

      - name: Check allowlist example
        run: undertaker --allowlist examples/allowlist.example.json --no-json
