<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Undertaker project banner</title>
  <desc id="desc">A dark professional banner for the Undertaker legacy automation auditor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="0.54" stop-color="#14111a"/>
      <stop offset="1" stop-color="#0e1720"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f4fa3"/>
      <stop offset="1" stop-color="#b99a5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="none" stroke="#342944" stroke-width="2"/>

  <g opacity="0.12" stroke="#8b74ad" stroke-width="1">
    <path d="M0 84 H1200"/>
    <path d="M0 150 H1200"/>
    <path d="M0 216 H1200"/>
    <path d="M0 282 H1200"/>
    <path d="M178 0 V360"/>
    <path d="M436 0 V360"/>
    <path d="M760 0 V360"/>
    <path d="M1030 0 V360"/>
  </g>

  <g transform="translate(785 70)" filter="url(#shadow)">
    <rect x="0" y="38" width="260" height="170" rx="10" fill="#11131a" stroke="#6f4fa3" stroke-width="3"/>
    <rect x="28" y="0" width="204" height="70" rx="8" fill="#171a22" stroke="#b99a5f" stroke-width="3"/>
    <rect x="28" y="78" width="204" height="22" rx="5" fill="#2a2434"/>
    <rect x="28" y="116" width="168" height="14" rx="4" fill="#817294"/>
    <rect x="28" y="146" width="188" height="14" rx="4" fill="#817294"/>
    <rect x="28" y="176" width="132" height="14" rx="4" fill="#817294"/>
    <text x="50" y="45" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#d7c7ef">AGE + PRIVILEGE</text>
  </g>

  <g transform="translate(78 72)">
    <rect x="0" y="0" width="126" height="28" rx="4" fill="#6f4fa3"/>
    <text x="15" y="19" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#f5f1ea">LEGACY REVIEW</text>
    <text x="0" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#f4f1f7">Undertaker</text>
    <rect x="0" y="112" width="420" height="5" fill="url(#accent)"/>
    <text x="0" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#d9d0e8">Scheduled Task Auditor</text>
    <text x="0" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#b9adc8">Find old, privileged scheduled jobs before they become operational risk.</text>
  </g>
</svg>
