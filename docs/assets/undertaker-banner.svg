<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Undertaker project banner</title>
  <desc id="desc">A dark archive-themed banner for the Undertaker legacy automation auditor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="0.55" stop-color="#252018"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7a15a"/>
      <stop offset="1" stop-color="#8fb3a5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="none" stroke="#3b352a" stroke-width="2"/>

  <g opacity="0.13" stroke="#d6c08a" stroke-width="1">
    <path d="M0 78 H1200"/>
    <path d="M0 145 H1200"/>
    <path d="M0 212 H1200"/>
    <path d="M0 279 H1200"/>
    <path d="M162 0 V360"/>
    <path d="M437 0 V360"/>
    <path d="M812 0 V360"/>
    <path d="M1030 0 V360"/>
  </g>

  <g transform="translate(820 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="210" rx="8" fill="#211d17" stroke="#c7a15a" stroke-width="3"/>
    <rect x="30" y="42" width="190" height="16" rx="3" fill="#c7a15a"/>
    <rect x="30" y="78" width="150" height="10" rx="3" fill="#7d8f86"/>
    <rect x="30" y="104" width="172" height="10" rx="3" fill="#7d8f86"/>
    <rect x="30" y="130" width="122" height="10" rx="3" fill="#7d8f86"/>
    <path d="M60 178 H190" stroke="#c7a15a" stroke-width="6" stroke-linecap="round"/>
    <path d="M125 150 V205" stroke="#c7a15a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(78 72)">
    <rect x="0" y="0" width="102" height="28" rx="4" fill="#c7a15a"/>
    <text x="16" y="19" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#151515">CASE FILE</text>
    <text x="0" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" fill="#f4f1e8">Undertaker</text>
    <rect x="0" y="112" width="390" height="5" fill="url(#accent)"/>
    <text x="0" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#d8d1c2">Legacy Automation Auditor</text>
    <text x="0" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#aeb7ad">Find old, privileged scheduled jobs before they become operational risk.</text>
  </g>
</svg>
