<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Undertaker project banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060C"/>
      <stop offset="100%" stop-color="#0D0A18"/>
    </linearGradient>
    <filter id="gr"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="ga"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="360" fill="#B91C1C"/>

  <!-- faded hourglass watermark -->
  <g transform="translate(16,12)" opacity="0.05" fill="#F59E0B">
    <polygon points="14,0 248,0 131,150 248,300 14,300 131,150"/>
  </g>

  <!-- LEFT PANEL -->
  <text x="48" y="94" font-family="'Courier New',Courier,monospace" font-size="64" font-weight="bold" fill="#FFFFFF">Undertaker</text>
  <text x="52" y="124" font-family="'Courier New',Courier,monospace" font-size="11" fill="#4C1D95" letter-spacing="3">LEGACY AUTOMATION AUDITOR</text>
  <text x="52" y="146" font-family="'Courier New',Courier,monospace" font-size="11" fill="#374151">Old jobs. High privilege. Still running.</text>
  <g font-family="'Courier New',Courier,monospace" font-size="10">
    <rect x="52"  y="163" width="82" height="18" rx="3" fill="#0D0A18"/>
    <text x="60"  y="176" fill="#4C1D95">python </text><text x="103" y="176" fill="#B91C1C">3.8+</text>
    <rect x="140" y="163" width="80" height="18" rx="3" fill="#0D0A18"/>
    <text x="148" y="176" fill="#4C1D95">linux </text><text x="183" y="176" fill="#22C55E">+win</text>
    <rect x="226" y="163" width="54" height="18" rx="3" fill="#0D0A18"/>
    <text x="234" y="176" fill="#4C1D95">MIT </text><text x="256" y="176" fill="#22C55E">✓</text>
  </g>
  <!-- mini hourglass icon -->
  <g transform="translate(52,204)">
    <polygon points="0,0 58,0 29,42 58,84 0,84 29,42" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.45"/>
    <polygon points="5,6 53,6 29,38" fill="#F59E0B" opacity="0.3"/>
    <polygon points="8,78 50,78 29,46" fill="#F59E0B" opacity="0.4"/>
    <line x1="29" y1="38" x2="29" y2="46" stroke="#F59E0B" stroke-width="1.5" opacity="0.55"/>
    <text x="66" y="18" font-family="'Courier New',Courier,monospace" font-size="9" fill="#4C1D95">age</text>
    <text x="66" y="44" font-family="'Courier New',Courier,monospace" font-size="12" fill="#B91C1C">×</text>
    <text x="66" y="70" font-family="'Courier New',Courier,monospace" font-size="9" fill="#4C1D95">priv</text>
  </g>

  <!-- RIGHT PANEL: SCATTER PLOT — no terminal window, no chrome -->
  <!-- chart: x=462–1160 (698px = 0–900d), y=28–285 -->
  <!-- privilege rows: root=y68, admin=y168, user=y258 -->

  <!-- faint grid -->
  <g stroke="#140F28" stroke-width="1" stroke-dasharray="2,5">
    <line x1="470" y1="68"  x2="1162" y2="68"/>
    <line x1="470" y1="168" x2="1162" y2="168"/>
    <line x1="470" y1="258" x2="1162" y2="258"/>
    <line x1="695" y1="22"  x2="695"  y2="284"/>
    <line x1="928" y1="22"  x2="928"  y2="284"/>
    <line x1="1160" y1="22" x2="1160" y2="284"/>
  </g>

  <!-- danger zone fill (300d+) -->
  <rect x="695" y="22"  width="468" height="100" fill="#B91C1C" opacity="0.09" rx="3"/>
  <rect x="695" y="118" width="468" height="98"  fill="#D97706" opacity="0.06" rx="3"/>
  <text x="868" y="46" font-family="'Courier New',Courier,monospace" font-size="8" fill="#7F1D1D" letter-spacing="2.5" text-anchor="middle">HIGH RISK ZONE</text>

  <!-- 300d dashed boundary -->
  <line x1="695" y1="22" x2="695" y2="290" stroke="#B91C1C" stroke-width="1" stroke-dasharray="4,3" opacity="0.28"/>

  <!-- axes -->
  <line x1="462" y1="22" x2="462" y2="290" stroke="#1F1440" stroke-width="1.5"/>
  <line x1="462" y1="287" x2="1168" y2="287" stroke="#1F1440" stroke-width="1.5"/>
  <polygon points="1168,283 1175,287 1168,291" fill="#1F1440"/>
  <polygon points="458,22 462,15 466,22" fill="#1F1440"/>

  <!-- tick marks -->
  <g stroke="#1F1440" stroke-width="1">
    <line x1="462"  y1="287" x2="462"  y2="293"/>
    <line x1="695"  y1="287" x2="695"  y2="293"/>
    <line x1="928"  y1="287" x2="928"  y2="293"/>
    <line x1="1160" y1="287" x2="1160" y2="293"/>
    <line x1="457"  y1="68"  x2="462"  y2="68"/>
    <line x1="457"  y1="168" x2="462"  y2="168"/>
    <line x1="457"  y1="258" x2="462"  y2="258"/>
  </g>

  <!-- axis labels -->
  <text x="455" y="71"  font-family="'Courier New',Courier,monospace" font-size="9" fill="#374151" text-anchor="end">root</text>
  <text x="455" y="171" font-family="'Courier New',Courier,monospace" font-size="9" fill="#374151" text-anchor="end">admin</text>
  <text x="455" y="261" font-family="'Courier New',Courier,monospace" font-size="9" fill="#2D3748" text-anchor="end">user</text>
  <text x="462"  y="305" font-family="'Courier New',Courier,monospace" font-size="9" fill="#2D3748" text-anchor="middle">0d</text>
  <text x="695"  y="305" font-family="'Courier New',Courier,monospace" font-size="9" fill="#374151" text-anchor="middle">300d</text>
  <text x="928"  y="305" font-family="'Courier New',Courier,monospace" font-size="9" fill="#374151" text-anchor="middle">600d</text>
  <text x="1160" y="305" font-family="'Courier New',Courier,monospace" font-size="9" fill="#374151" text-anchor="middle">900d</text>
  <g transform="translate(432,172) rotate(-90)">
    <text font-family="'Courier New',Courier,monospace" font-size="8" fill="#2D1F4A" letter-spacing="1" text-anchor="middle">PRIVILEGE</text>
  </g>
  <text x="820" y="328" font-family="'Courier New',Courier,monospace" font-size="8" fill="#2D1F4A" letter-spacing="1" text-anchor="middle">DAYS SINCE LAST CHANGE</text>

  <!-- HIGH dots — root/SYSTEM — x = 462 + days*(698/900) -->
  <!-- run_cleanup.sh 847d root → x=1121 -->
  <circle cx="1121" cy="68" r="10" fill="#B91C1C" filter="url(#gr)"/>
  <text x="1109" y="54" font-family="'Courier New',Courier,monospace" font-size="8" fill="#FCA5A5" text-anchor="end">run_cleanup.sh</text>
  <!-- backup_old.bat 412d SYSTEM → x=782 -->
  <circle cx="782" cy="68" r="9" fill="#B91C1C" filter="url(#gr)"/>
  <text x="782" y="54" font-family="'Courier New',Courier,monospace" font-size="8" fill="#FCA5A5" text-anchor="middle">backup_old.bat</text>
  <!-- svc_export 680d root → x=990 unlabelled -->
  <circle cx="990" cy="68" r="7" fill="#991B1B" filter="url(#gr)" opacity="0.75"/>

  <!-- HIGH admin — old_sync.sh 528d → x=872 -->
  <circle cx="872" cy="168" r="8" fill="#C2410C" filter="url(#ga)"/>
  <text x="872" y="154" font-family="'Courier New',Courier,monospace" font-size="8" fill="#FCA5A5" text-anchor="middle">old_sync.sh</text>

  <!-- MEDIUM admin -->
  <!-- svc_monitor 203d → x=620 -->
  <circle cx="620" cy="168" r="7" fill="#D97706"/>
  <text x="620" y="154" font-family="'Courier New',Courier,monospace" font-size="8" fill="#FCD34D" text-anchor="middle">svc_monitor</text>
  <!-- legacy_notify 345d → x=730 -->
  <circle cx="730" cy="174" r="6" fill="#B45309" opacity="0.85"/>
  <!-- sched_import 445d → x=807 -->
  <circle cx="807" cy="162" r="6" fill="#92400E" opacity="0.75"/>

  <!-- LOW user dots -->
  <circle cx="496" cy="258" r="5" fill="#374151"/>
  <circle cx="486" cy="264" r="4" fill="#2D3748" opacity="0.75"/>
  <circle cx="571" cy="256" r="5" fill="#374151"/>
  <circle cx="664" cy="260" r="5" fill="#374151"/>
  <circle cx="534" cy="262" r="4" fill="#2D3748" opacity="0.65"/>
  <circle cx="609" cy="257" r="4" fill="#2D3748" opacity="0.65"/>
  <!-- LOW admin -->
  <circle cx="530" cy="172" r="4" fill="#374151" opacity="0.5"/>

  <!-- legend -->
  <g transform="translate(470,323)" font-family="'Courier New',Courier,monospace" font-size="9">
    <circle cx="5" cy="-1" r="5" fill="#B91C1C"/>
    <text x="14" y="3" fill="#4B5563">HIGH</text>
    <circle cx="68" cy="-1" r="5" fill="#D97706"/>
    <text x="77" y="3" fill="#4B5563">MEDIUM</text>
    <circle cx="152" cy="-1" r="5" fill="#374151"/>
    <text x="161" y="3" fill="#2D3748">LOW</text>
    <text x="212" y="3" fill="#1F1440">  each dot = one scheduled task</text>
  </g>

  <rect x="0" y="344" width="1200" height="16" fill="#B91C1C" opacity="0.7"/>
</svg>
