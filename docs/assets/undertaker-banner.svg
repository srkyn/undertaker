<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Undertaker project banner</title>
  <desc id="desc">A dark, professional graveyard-shift banner for the Undertaker legacy automation auditor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070a"/>
      <stop offset="0.50" stop-color="#151019"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b3b84"/>
      <stop offset="1" stop-color="#b99a5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="none" stroke="#35263f" stroke-width="2"/>

  <g opacity="0.13" stroke="#9a7cc0" stroke-width="1">
    <path d="M0 84 H1200"/>
    <path d="M0 150 H1200"/>
    <path d="M0 216 H1200"/>
    <path d="M0 282 H1200"/>
    <path d="M178 0 V360"/>
    <path d="M436 0 V360"/>
    <path d="M760 0 V360"/>
    <path d="M1030 0 V360"/>
  </g>

  <g transform="translate(800 54)" filter="url(#shadow)">
    <rect x="68" y="42" width="94" height="202" rx="44" fill="#111117" stroke="#7e5ca9" stroke-width="4"/>
    <rect x="42" y="82" width="146" height="38" rx="8" fill="#111117" stroke="#7e5ca9" stroke-width="4"/>
    <path d="M115 64 V222" stroke="#b99a5f" stroke-width="7" stroke-linecap="round"/>
    <path d="M72 104 H158" stroke="#b99a5f" stroke-width="7" stroke-linecap="round"/>
    <path d="M42 246 H188" stroke="#2a2430" stroke-width="16" stroke-linecap="round"/>
    <path d="M28 270 H204" stroke="#17141b" stroke-width="18" stroke-linecap="round"/>
    <rect x="22" y="276" width="186" height="18" rx="4" fill="#0c0c10" stroke="#40324d" stroke-width="2"/>
    <text x="52" y="290" font-family="Consolas, monospace" font-size="12" fill="#b99a5f">AGE + PRIVILEGE</text>
  </g>

  <g transform="translate(78 72)">
    <rect x="0" y="0" width="142" height="28" rx="4" fill="#7e5ca9"/>
    <text x="15" y="19" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#f5f1ea">GRAVEYARD SHIFT</text>
    <text x="0" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="850" fill="#f4f1f7">Undertaker</text>
    <rect x="0" y="112" width="420" height="5" fill="url(#purple)"/>
    <text x="0" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#d9d0e8">Legacy Automation Auditor</text>
    <text x="0" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#b9adc8">Find old, privileged scheduled jobs before they become operational risk.</text>
  </g>
</svg>
